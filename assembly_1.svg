<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Tilt-Pan-Platform, side view</title>
<desc id="d">Four legs support a base plate with the stepper motor hanging below it. The stepper shaft turns a yoke whose two uprights carry a tilting platform driven by a servo.</desc>


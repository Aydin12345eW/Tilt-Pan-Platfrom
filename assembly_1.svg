.m { fill: #6e7781; fill-opacity: .35; stroke: #6e7781; stroke-width: 1; }
.l { fill: none; stroke: #6e7781; stroke-width: 1.4; }
.s { stroke: #6e7781; stroke-width: 4; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6e7781; }
.h { font-size: 13px; font-weight: 600; }
.n { font-size: 12px; }
</style>
</defs>

